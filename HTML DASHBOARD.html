<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bitácora Diaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: cabecera tipo dorsal de carrera, fila de "hoy", luego gráficas en grilla 2 col → 1 col en móvil */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#17201b; --muted:#5f6b64; --line:#dde3de;
  --sleep:#4c5fd5; --food:#e07a1f; --prot:#b4482f; --move:#1f9d6b; --accent:#17201b;
  --good:#1f9d6b; --warn:#d18a00; --bad:#c2412d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1411; --surface:#171e1a; --fg:#e7ede9; --muted:#93a19a; --line:#26312b;
  --sleep:#8b9bff; --food:#f2a04f; --prot:#e9775c; --move:#45c992; --accent:#e7ede9;
  --good:#45c992; --warn:#f0b43c; --bad:#ee6a52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1411; --surface:#171e1a; --fg:#e7ede9; --muted:#93a19a; --line:#26312b;
  --sleep:#8b9bff; --food:#f2a04f; --prot:#e9775c; --move:#45c992; --accent:#e7ede9;
  --good:#45c992; --warn:#f0b43c; --bad:#ee6a52; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.bib{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(2rem,6vw,3.2rem)/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.date{font:500 .9rem var(--mono);color:var(--muted)}
.range{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.range button{font:600 .85rem var(--body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.range button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.range button:focus-visible,.goal input:focus-visible{outline:2px solid var(--sleep);outline-offset:2px}
.banner{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.banner[hidden]{display:none}
.today{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:2px;min-width:0}
.stat .k{font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .v{font:800 2rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .v small{font:500 .8rem var(--body);color:var(--muted);margin-left:3px}
.stat .s{font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;font:600 .7rem var(--body);padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.ok{color:var(--good)} .mid{color:var(--warn)} .low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;display:grid;gap:10px}
.card h2{font:700 1.25rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font:500 .8rem var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.chart{position:relative;height:220px}
.wide{grid-column:1/-1}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:4px}
.heat div{aspect-ratio:1;border-radius:4px;background:var(--line);max-width:100%}
.heat div[data-l="1"]{background:color-mix(in srgb,var(--move) 40%,var(--line))}
.heat div[data-l="2"]{background:color-mix(in srgb,var(--move) 70%,var(--line))}
.heat div[data-l="3"]{background:var(--move)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.goals{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:.85rem;color:var(--muted)}
.goal{display:flex;align-items:center;gap:6px}
.goal input{width:72px;font:500 .85rem var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
@media (max-width:800px){.today{grid-template-columns:repeat(2,minmax(0,1fr))}.today .stat:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bib"><h1>Bitácora diaria</h1><span class="date" id="hoyTxt"></span></div>
    <div class="range" role="group" aria-label="Rango">
      <button data-d="7" aria-pressed="false">7 días</button>
      <button data-d="30" aria-pressed="true">30 días</button>
      <button data-d="90" aria-pressed="false">90 días</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section class="today" id="today" aria-label="Último día registrado"></section>

  <div class="grid">
    <article class="card"><h2>Sueño <span id="sleepAvg"></span></h2><div class="chart"><canvas id="cSleep"></canvas></div></article>
    <article class="card"><h2>Comida <span id="foodAvg"></span></h2><div class="chart"><canvas id="cFood"></canvas></div></article>
    <article class="card"><h2>Running <span id="runTot"></span></h2><div class="chart"><canvas id="cRun"></canvas></div></article>
    <article class="card"><h2>Entrenos <span id="streak"></span></h2>
      <div class="heat" id="heat"></div>
      <div class="legend"><span>Sin entreno</span><span>· &lt;30 min</span><span>· 30–60</span><span>· +60 min</span></div>
      <div class="legend" id="mix"></div>
    </article>
    <article class="card wide"><h2>Días <span>últimos registros</span></h2>
      <div class="tbl"><table><thead><tr><th>Fecha</th><th>Sueño</th><th>Kcal</th><th>Proteína</th><th>Pasos</th><th>Entrenos</th></tr></thead><tbody id="rows"></tbody></table></div>
    </article>
  </div>

  <div class="goals">
    <strong>Metas:</strong>
    <label class="goal" for="gSleep">Sueño (h) <input id="gSleep" type="number" step="0.5"></label>
    <label class="goal" for="gKcal">Kcal <input id="gKcal" type="number" step="50"></label>
    <label class="goal" for="gProt">Proteína (g) <input id="gProt" type="number" step="5"></label>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const num=x=>{if(x==null||x==="")return null;const n=parseFloat(String(x).replace(/\s/g,"").replace(",","."));return isNaN(n)?null:n};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const goals=Object.assign({sleep:7.5,kcal:2400,prot:130},store.get("metas",{}));
let days=[], range=store.get("rango",30), charts={};

/* entrenos: "Correr|32|5.1;Fuerza|45|0" o lista de objetos */
function parseWorkouts(w){
  if(!w)return[];
  if(Array.isArray(w))return w.map(o=>({tipo:o.tipo||"Entreno",min:num(o.min)||0,km:num(o.km)||0}));
  return String(w).split(/[;\n]/).map(s=>s.trim()).filter(Boolean).map(s=>{const[t,m,k]=s.split("|");return{tipo:(t||"Entreno").trim(),min:num(m)||0,km:num(k)||0}});
}
function normalize(r){
  const sh=num(r.sueno_h)??(num(r.sueno_min)!=null?num(r.sueno_min)/60:null);
  return{fecha:String(r.fecha).slice(0,10),sueno:sh,kcal:num(r.kcal),prot:num(r.proteina_g),pasos:num(r.pasos),entrenos:parseWorkouts(r.entrenos)};
}
const isRun=t=>/corr|run|trote/i.test(t);

async function loadReal(){
  const h=location.hostname;
  if(!h.endsWith("github.io"))return null;
  const owner=h.split(".")[0], repo=location.pathname.split("/").filter(Boolean)[0]||`${owner}.github.io`;
  const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data`,{cache:"no-store"});
  if(!res.ok)return[];
  const files=(await res.json()).filter(f=>f.name.endsWith(".json")).sort((a,b)=>a.name.localeCompare(b.name));
  const latest={}; files.forEach(f=>latest[f.name.slice(0,10)]=f); // último archivo de cada día gana
  const list=Object.values(latest).slice(-120);
  const out=await Promise.all(list.map(f=>fetch(f.download_url,{cache:"no-store"}).then(r=>r.json()).catch(()=>null)));
  return out.filter(Boolean).map(normalize);
}
function sample(){
  const out=[],t=new Date();
  for(let i=59;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);
    const ent=[];const r=Math.random();
    if(i%7===1||i%7===4||i%7===6)ent.push({tipo:"Correr",min:28+Math.round(Math.random()*30),km:+(4.5+Math.random()*4).toFixed(1)});
    if(i%7===2||i%7===5)ent.push({tipo:"Fuerza",min:45+Math.round(r*20),km:0});
    out.push({fecha:d.toISOString().slice(0,10),sueno:+(6+Math.random()*2.2).toFixed(1),kcal:2000+Math.round(Math.random()*700),prot:100+Math.round(Math.random()*50),pasos:6000+Math.round(Math.random()*7000),entrenos:ent});}
  return out;
}

function fmtDay(s){const d=new Date(s+"T12:00");return d.toLocaleDateString("es-CO",{day:"numeric",month:"short"})}
function cls(v,g){if(v==null)return"";return v>=g?"ok":v>=g*.85?"mid":"low"}
const avg=a=>{const b=a.filter(x=>x!=null);return b.length?b.reduce((s,x)=>s+x,0)/b.length:null};
const f1=x=>x==null?"–":x.toLocaleString("es-CO",{maximumFractionDigits:1});
const f0=x=>x==null?"–":Math.round(x).toLocaleString("es-CO");

function renderToday(){
  const d=days[days.length-1]; if(!d){$("#today").innerHTML="";return}
  const run=d.entrenos.filter(e=>isRun(e.tipo)), km=run.reduce((s,e)=>s+e.km,0), min=d.entrenos.reduce((s,e)=>s+e.min,0);
  const pace=km&&run.length?run.reduce((s,e)=>s+e.min,0)/km:null;
  const paceTxt=pace?`${Math.floor(pace)}:${String(Math.round((pace%1)*60)).padStart(2,"0")} /km`:"sin carrera";
  $("#today").innerHTML=`
   <div class="stat"><span class="k">Último registro</span><span class="v">${fmtDay(d.fecha)}</span><span class="s">${d.entrenos.length?d.entrenos.map(e=>e.tipo).join(" + "):"Día de descanso"}</span></div>
   <div class="stat"><span class="k"><i style="background:var(--sleep)"></i>Sueño</span><span class="v">${f1(d.sueno)}<small>h</small></span><span class="s"><span class="pill ${cls(d.sueno,goals.sleep)}">meta ${goals.sleep} h</span></span></div>
   <div class="stat"><span class="k"><i style="background:var(--food)"></i>Calorías</span><span class="v">${f0(d.kcal)}<small>kcal</small></span><span class="s"><span class="pill ${cls(d.kcal,goals.kcal)}">meta ${f0(goals.kcal)}</span></span></div>
   <div class="stat"><span class="k"><i style="background:var(--prot)"></i>Proteína</span><span class="v">${f0(d.prot)}<small>g</small></span><span class="s"><span class="pill ${cls(d.prot,goals.prot)}">meta ${goals.prot} g</span></span></div>
   <div class="stat"><span class="k"><i style="background:var(--move)"></i>Movimiento</span><span class="v">${f1(km)}<small>km</small></span><span class="s">${min} min · ${paceTxt}</span></div>`;
}

function baseOpts(extra={}){
  const fg=css("--muted"),line=css("--line");
  return Object.assign({responsive:true,maintainAspectRatio:false,animation:false,
    plugins:{legend:{display:false},tooltip:{mode:"index",intersect:false}},
    scales:{x:{grid:{display:false},ticks:{color:fg,maxRotation:0,autoSkipPadding:12,font:{family:css("--mono"),size:10}}},
            y:{grid:{color:line},border:{display:false},ticks:{color:fg,font:{family:css("--mono"),size:10}}}}},extra);
}
function draw(id,cfg){charts[id]?.destroy();charts[id]=new Chart(document.getElementById(id),cfg)}
const goalLine=(v,n,color)=>({type:"line",label:"Meta",data:Array(n).fill(v),borderColor:color,borderDash:[4,4],borderWidth:1.5,pointRadius:0});

function renderCharts(view){
  const L=view.map(d=>fmtDay(d.fecha)), n=view.length;
  draw("cSleep",{type:"bar",data:{labels:L,datasets:[{label:"Horas",data:view.map(d=>d.sueno),backgroundColor:css("--sleep"),borderRadius:3},goalLine(goals.sleep,n,css("--fg"))]},options:baseOpts()});
  draw("cFood",{type:"bar",data:{labels:L,datasets:[
    {label:"Kcal",data:view.map(d=>d.kcal),backgroundColor:css("--food"),borderRadius:3,yAxisID:"y"},
    {type:"line",label:"Proteína (g)",data:view.map(d=>d.prot),borderColor:css("--prot"),backgroundColor:css("--prot"),pointRadius:2,tension:.3,yAxisID:"y1"}]},
    options:baseOpts({scales:{...baseOpts().scales,y1:{position:"right",grid:{display:false},ticks:{color:css("--prot"),font:{family:css("--mono"),size:10}}}}})});
  const km=view.map(d=>d.entrenos.filter(e=>isRun(e.tipo)).reduce((s,e)=>s+e.km,0)||null);
  draw("cRun",{type:"bar",data:{labels:L,datasets:[{label:"km",data:km,backgroundColor:css("--move"),borderRadius:3}]},options:baseOpts()});
  $("#sleepAvg").textContent=`prom. ${f1(avg(view.map(d=>d.sueno)))} h`;
  $("#foodAvg").textContent=`prom. ${f0(avg(view.map(d=>d.kcal)))} kcal · ${f0(avg(view.map(d=>d.prot)))} g`;
  $("#runTot").textContent=`${f1(km.reduce((s,x)=>s+(x||0),0))} km`;
}

function renderHeat(view){
  $("#heat").innerHTML=view.map(d=>{const m=d.entrenos.reduce((s,e)=>s+e.min,0);const l=m===0?0:m<30?1:m<=60?2:3;
    return `<div data-l="${l}" title="${fmtDay(d.fecha)}: ${m} min"></div>`}).join("");
  let s=0;for(let i=days.length-1;i>=0&&days[i].entrenos.length;i--)s++;
  $("#streak").textContent=`racha ${s} día${s===1?"":"s"}`;
  const mix={};view.forEach(d=>d.entrenos.forEach(e=>mix[e.tipo]=(mix[e.tipo]||0)+1));
  $("#mix").textContent=Object.entries(mix).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`${t}: ${c}`).join(" · ")||"Sin entrenos en este rango";
}

function renderTable(){
  $("#rows").innerHTML=days.slice(-14).reverse().map(d=>`<tr><td>${fmtDay(d.fecha)}</td>
    <td class="num ${cls(d.sueno,goals.sleep)}">${f1(d.sueno)}</td><td class="num">${f0(d.kcal)}</td>
    <td class="num ${cls(d.prot,goals.prot)}">${f0(d.prot)}</td><td class="num">${f0(d.pasos)}</td>
    <td>${d.entrenos.map(e=>`${e.tipo} ${e.min}′${e.km?` · ${e.km} km`:""}`).join(", ")||"–"}</td></tr>`).join("");
}

function render(){
  const view=days.slice(-range);
  document.querySelectorAll(".range button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.d===range)));
  renderToday();renderCharts(view);renderHeat(view);renderTable();
}

document.querySelectorAll(".range button").forEach(b=>b.addEventListener("click",()=>{range=+b.dataset.d;store.set("rango",range);render()}));
[["gSleep","sleep"],["gKcal","kcal"],["gProt","prot"]].forEach(([id,k])=>{const el=document.getElementById(id);el.value=goals[k];
  el.addEventListener("change",()=>{const v=num(el.value);if(v){goals[k]=v;store.set("metas",goals);render()}})});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());
$("#hoyTxt").textContent=new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});

(async()=>{
  let real=null;
  try{real=await loadReal()}catch(e){real=[]}
  if(real&&real.length){days=real.sort((a,b)=>a.fecha.localeCompare(b.fecha))}
  else{days=sample();const b=$("#banner");b.hidden=false;
    b.textContent=real?"Todavía no hay archivos en la carpeta data/. Mientras tanto ves datos de ejemplo; aparecerán los tuyos cuando corra el Atajo.":"Datos de ejemplo. Cuando la página esté en GitHub Pages leerá tus archivos de la carpeta data/."}
  render();
})();
</script>
</body>
</html>
